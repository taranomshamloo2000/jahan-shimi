<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>چالش بزرگ جدول تناوبی مندلیف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
<style>
:root{--bg:#0a0e2a;--p:#7c5cff;--b:#27c3ff;--t:#eaf0ff;--m:#9aa6d6;--ok:#2ecc71;--no:#ff4d6d;--cd:#151b48;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}*{box-sizing:inherit}
body{margin:0;font:15px/1.7 Vazirmatn,Tahoma,sans-serif;color:var(--t);background:radial-gradient(circle at 80% -10%,#3b2a9a66,transparent 50%),radial-gradient(circle at 0 100%,#0b7fb855,transparent 45%),var(--bg);min-height:100dvh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:900px;margin:auto;padding:12px}
h1{font-size:clamp(26px,7vw,44px);text-align:center;margin:24px 0 4px;background:linear-gradient(90deg,var(--b),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;line-height:1.4}
h2{margin:8px 0 0}.sub{text-align:center;color:var(--m);margin:4px 0 14px}
.bt{min-height:48px;padding:0 18px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--p),#4f7cff);color:#fff;font:700 15px Vazirmatn,Tahoma;cursor:pointer}.bt.g{background:var(--cd);border:1px solid #ffffff33}
.cd{background:var(--cd);border:1px solid #ffffff1a;border-radius:18px;padding:14px;margin:10px 0}
.mc{display:block;width:100%;text-align:right;background:var(--cd);border:1px solid #7c5cff77;border-radius:18px;padding:14px;margin:10px 0;color:var(--t);font:inherit;cursor:pointer}.mc b{display:block;font-size:17px}.mc span{color:var(--m);font-size:13px}
input{width:100%;min-height:48px;border-radius:12px;border:1px solid #ffffff33;background:#0006;color:var(--t);padding:0 12px;font:inherit}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.ch{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #ffffff33;background:transparent;color:var(--t);font:inherit;cursor:pointer}.ch.on{background:var(--p);border-color:var(--p)}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 0}
.ic{width:44px;height:44px;border-radius:12px;border:0;background:var(--cd);color:var(--t);font-size:18px;cursor:pointer}
.tm{flex:1;text-align:center;font:900 24px Vazirmatn;color:var(--b)}.tm.low{color:var(--no);animation:bl .6s infinite alternate}@keyframes bl{to{opacity:.4}}
.pr{color:var(--m);font-size:13px}.bar{height:6px;background:#ffffff1a;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--p));transition:width .3s}
.q{font-weight:700;font-size:17px;margin:12px 0}.sc{overflow-x:auto;padding-bottom:6px}
.g{direction:ltr;display:grid;grid-template-columns:repeat(19,minmax(28px,1fr));gap:2px;min-width:560px}.g i.l{font:10px sans-serif;color:var(--m);text-align:center;font-style:normal;align-self:center}
.c{aspect-ratio:1;border-radius:5px;background:#ffffff14;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 11px sans-serif;line-height:1.1;cursor:pointer;color:#fff}.c small{font-size:7px;opacity:.8}
.c.sel{background:var(--p)}.c.ok{background:var(--ok)}.c.bad{background:var(--no);animation:sh .3s}.c.miss{outline:2px dashed #ffd43b}.c.hl{background:#27c3ff66}@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.k{min-width:78px;padding:8px;border-radius:12px;background:var(--cd);border:2px solid #7c5cff77;text-align:center;cursor:grab;display:flex;flex-direction:column}.k b{font:900 22px sans-serif}.k small,.k span{font-size:11px;color:var(--m)}.k.on{border-color:#ffd43b;background:#3a3470}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row .bt{flex:1}
.op{display:block;width:100%;text-align:right;min-height:52px;margin:8px 0;padding:10px 14px;border-radius:14px;border:2px solid #ffffff2a;background:var(--cd);color:var(--t);font:inherit;cursor:pointer}.op.ok{border-color:var(--ok);background:#2ecc7133}.op.no{border-color:var(--no);background:#ff4d6d33}.op.off{opacity:.25}.op.on{border-color:#ffd43b}
.im{display:block;margin:10px auto;max-width:100%;border-radius:12px}.lt{display:flex;gap:8px}.lt .op{flex:1;text-align:center;font:900 22px sans-serif;margin:0}
.rp{text-align:center}.big{font:900 46px Vazirmatn;color:var(--b)}.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:right;margin:10px 0}.st div{background:#0004;border-radius:12px;padding:6px 12px}
.rv{text-align:right;border-top:1px solid #ffffff1a;padding:8px 0;font-size:14px}.cr{text-align:center;color:var(--m);font-size:12px;margin:26px 0 10px}
#ov{display:none;position:fixed;inset:0;background:#0a0e2af2;z-index:30;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:22px}body.pz #ov{display:flex}
#ts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 16px;border-radius:12px;z-index:40;display:none}a{color:var(--b)}
@media print{.hd,.nop,#ov{display:none!important}body{background:#fff;color:#000}.cd{background:#fff;border-color:#999}.big,.st div{color:#000;background:#eee}}
