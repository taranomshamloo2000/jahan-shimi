addEventListener('DOMContentLoaded',()=>{try{
const T=[...document.querySelectorAll('audio.trk')],sel=$('mpt'),sk=$('mps'),pp=$('mpp'),vol=$('mpv'),mu=$('mu'),mp=$('mp');
const audioParts=[{mime:"audio/mp4;base64",count:13},{mime:"audio/mpeg;base64",count:10},{mime:"audio/mp4;base64",count:6}];
const AUDIO_BASE=new URL('assets/audio/',location.href).href;

async function ensureAudio(k){
 if(T[k].src) return;
 if(!loads[k]) loads[k]=(async()=>{
  const p=audioParts[k];
  const chunks=await Promise.all(Array.from({length:p.count},(_,j)=>fetch(AUDIO_BASE+'track-'+k+'-'+String(j).padStart(2,'0')+'.txt').then(r=>{if(!r.ok)throw new Error('audio asset '+r.status);return r.text()})));
  const raw=atob(chunks.join('')),bytes=new Uint8Array(raw.length);
  for(let n=0;n<raw.length;n++)bytes[n]=raw.charCodeAt(n);
  T[k].src=URL.createObjectURL(new Blob([bytes],{type:p.mime}));T[k].load();
 })();
 return loads[k];
}
const play=()=>ensureAudio(i).then(()=>cur().play()).then(ui).catch(()=>{pp.textContent='↻';$('mpd').textContent='خطا در بارگذاری';});
const pick=(n,go)=>{const was=!cur().paused||go;cur().pause();i=(n+T.length)%T.length;sel.value=i;cur().currentTime=0;sk.value=0;if(was)play();ui()};
