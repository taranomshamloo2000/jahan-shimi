<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d20"><title>عضویت | جهان شیمی</title><link rel="icon" href="/jahan-shimi/icons/tari-world-192.png" type="image/png"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#080d20;--text:#f4f6ff;--muted:#aab6d4;--cyan:#50e3e6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#38247766,transparent 38%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh}.wrap{width:min(520px,92%);margin:40px auto}.panel{background:#111a35;border:1px solid #ffffff20;border-radius:24px;padding:26px;box-shadow:0 20px 60px #0005}h1{text-align:center;margin:0 0 8px}p{color:var(--muted);line-height:1.9}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button,.submit,.secondary{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}.tabs button{flex:1;background:#202d50;color:white}.tabs button.active,.submit{background:linear-gradient(110deg,#7258e9,#278da9);color:white}label{display:block;margin:14px 0 6px}input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff25;background:#091329;color:white;font:inherit}input:focus{outline:2px solid var(--cyan)}.submit{width:100%;margin-top:20px}.secondary{width:100%;margin-top:10px;background:#263455;color:white}.status{margin-top:14px;color:var(--cyan);font-size:14px;line-height:1.8}.back{display:block;text-align:center;margin-top:22px;color:var(--cyan);text-decoration:none}small{color:var(--muted)}
</style></head><body><main class="wrap"><section class="panel"><h1>🌌 عضویت در جهان شیمی</h1><p style="text-align:center">حساب بساز و مسیر یادگیری‌ات را ادامه بده.</p><div class="tabs"><button class="active" id="signupTab" type="button">ثبت‌نام</button><button id="loginTab" type="button">ورود</button></div><form id="authForm"><label for="username">نام کاربری</label><input id="username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_آ-ی۰-۹-]+" placeholder="مثلاً Taranom10" required><label for="password">رمز عبور</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="حداقل ۸ نویسه" required><button class="submit" id="submitBtn" type="submit">ساخت حساب</button><div class="status" id="status" role="status" aria-live="polite"></div></form><button class="secondary" id="logoutBtn" type="button" hidden>خروج از حساب</button><p><small>رمز عبور به‌صورت هش‌شده ذخیره می‌شود. رمزت را با کسی به اشتراک نگذار.</small></p><a class="back" href="index.html">← بازگشت به صفحهٔ اصلی</a></section></main><script>
const API_BASE = "https://jahan-shimi-api.YOUR-SUBDOMAIN.workers.dev";
let mode="signup";const form=document.getElementById("authForm"),username=document.getElementById("username"),password=document.getElementById("password"),status=document.getElementById("status"),submit=document.getElementById("submitBtn"),logout=document.getElementById("logoutBtn"),signup=document.getElementById("signupTab"),login=document.getElementById("loginTab");
function setMode(m){mode=m;signup.classList.toggle("active",m==="signup");login.classList.toggle("active",m==="login");submit.textContent=m==="signup"?"ساخت حساب":"ورود به حساب";password.autocomplete=m==="signup"?"new-password":"current-password";status.textContent=""}
signup.onclick=()=>setMode("signup");login.onclick=()=>setMode("login");
async function call(path,body,token){const res=await fetch(API_BASE+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},...(body?{body:JSON.stringify(body)}:{})});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||"ارتباط با سرور برقرار نشد.");return data}
form.addEventListener("submit",async e=>{e.preventDefault();if(API_BASE.includes("YOUR-SUBDOMAIN")){status.textContent="سرور ساخته شده، اما هنوز نشانی اختصاصی Workers را در تنظیمات سایت وارد نکرده‌ایم؛ ثبت‌نام هنوز فعال نشده است.";return}submit.disabled=true;submit.textContent="لطفاً صبر کن…";status.textContent="";try{const data=await call(mode==="signup"?"/api/auth/signup":"/api/auth/login",{username:username.value.trim(),password:password.value});sessionStorage.setItem("jahanShimiToken",data.token);status.textContent="ورود موفق بود؛ خوش آمدی "+data.user.username+" 🌟";logout.hidden=false;if(mode==="signup")setMode("login");}catch(err){status.textContent=err.message}finally{submit.disabled=false;submit.textContent=mode==="signup"?"ساخت حساب":"ورود به حساب"}});
logout.onclick=()=>{sessionStorage.removeItem("jahanShimiToken");status.textContent="از حساب خارج شدی.";logout.hidden=true;password.value=""};
if(sessionStorage.getItem("jahanShimiToken")){logout.hidden=false;status.textContent="نشست قبلی در این مرورگر موجود است."}
</script></body></html>
